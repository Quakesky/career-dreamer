<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado Vocacional — Career Dreamer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="container topo__conteudo">
      <a href="index.html" class="marca">
        <span class="marca__simbolo">✨</span>
        <span>Career Dreamer</span>
      </a>
      <a href="index.html" class="botao botao--secundario">Novo Mapeamento</a>
    </div>
  </header>

  <main>
    <div class="container pagina-resultado">
      <section id="resultado" hidden>
        <h1 id="nome-usuario">Perfil de Usuário</h1>
        <p id="sintese" class="sintese"></p>

        <h2 class="subtitulo">Carreiras Recomendadas</h2>
        <ul id="lista-carreiras" class="lista-carreiras"></ul>
      </section>

      <section id="sem-resultado" class="cartao vazio">
        <h2>Nenhum resultado encontrado</h2>
        <p>Não encontramos dados de mapeamento vocacional salvos ou a sessão expirou.</p>
        <a href="index.html" class="botao">Voltar ao formulário</a>
      </section>
    </div>
  </main>

  <template id="modelo-carreira">
    <li class="cartao carreira">
      <div class="carreira__topo">
        <div>
          <span class="carreira__selo" hidden>Melhor combinação</span>
          <h3 class="carreira__titulo">Título da Carreira</h3>
        </div>
        <div class="carreira__nota">
          <span class="carreira__percentual">0%</span>
          <span class="carreira__legenda">compatibilidade</span>
        </div>
      </div>
      <div class="barra" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <span class="barra__nivel" style="--nivel: 0%;"></span>
      </div>
      <p class="carreira__resumo">Resumo da carreira...</p>
      
      <h4>Competências-chave</h4>
      <ul class="chips"></ul>

      <h4>Roteiro de Estudos</h4>
      <ol class="roteiro"></ol>
    </li>
  </template>

  <footer class="rodape">
    <div class="container">
      <p>&copy; 2026 Career Dreamer. Todos os direitos reservados.</p>
    </div>
  </footer>

  <!-- Scripts apontando corretamente para a pasta Javascript -->
  <script src="Javascript/config.js"></script>
  <script src="Javascript/dados-exemplo.js"></script>
  <script src="Javascript/resultado.js"></script>
</body>
</html>
